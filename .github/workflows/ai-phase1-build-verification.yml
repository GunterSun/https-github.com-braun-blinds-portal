name: AI Phase 1 Build Verification (Manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - name: Validate lockfile and install without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: AI isolated unit tests
        run: node --experimental-strip-types --test tests/ai/*.test.mjs
      - name: Portal build (no deploy)
        run: npm run build
# Manual only: no secrets, no D1 migration, no deploy, no customer communication.
