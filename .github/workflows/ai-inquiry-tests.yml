name: AI Inquiry Draft Isolated Tests
on:
  pull_request:
    paths:
      - 'lib/ai/**'
      - 'app/ai/**'
      - 'tests/ai/**'
      - 'package-lock.json'
      - 'package.json'
      - '.github/workflows/ai-inquiry-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inquiry-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Dependency-free AI inquiry tests
        run: node --experimental-strip-types --test tests/ai/*.test.mjs
  portal-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build portal without deploying
        run: npm run build
# Isolated tests and full build are CI-only. No deploy, D1, customer email or production credentials.
