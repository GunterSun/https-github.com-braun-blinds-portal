name: AI Inquiry Draft Isolated Tests
on:
  pull_request:
    paths:
      - 'lib/ai/**'
      - 'app/ai/**'
      - 'tests/ai/**'
      - '.github/workflows/ai-inquiry-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inquiry-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
      - name: Dependency-free AI inquiry tests
        run: node --experimental-strip-types --test tests/ai/*.test.mjs
# No npm install, no deploy, no D1, no customer email or production credentials.
