name: AI Inquiry Draft Isolated Tests
on:
  pull_request:
    paths:
      - 'lib/ai/**'
      - 'tests/ai/**'
      - '.github/workflows/ai-inquiry-tests.yml'
      - 'package*.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inquiry-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Draft-only inquiry unit tests
        run: node --test tests/ai/inquiry.test.mjs
      - name: Existing Z-series unit tests
        run: node --test tests/z-series-formal.test.mjs
# No deploy, no production credentials, no D1 binding, no outbound customer messages.
